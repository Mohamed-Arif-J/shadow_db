<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cylinder 1 (Top) Gradient -->
    <linearGradient id="topPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Cylinder 2 (Middle) Gradient -->
    <linearGradient id="midPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Cylinder 3 (Bottom) Gradient -->
    <linearGradient id="botPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#rimGlow)" stroke-width="1.5" />

  <!-- Shadow Glow behind database -->
  <ellipse cx="32" cy="51" rx="16" ry="4" fill="#00f0ff" opacity="0.35" filter="url(#shadowGlow)" />

  <!-- DATABASE TIER 3 (BOTTOM) -->
  <path d="M17 38 C17 34 47 34 47 38 L47 43 C47 47 17 47 17 43 Z" fill="url(#botPlate)" opacity="0.95" />
  <ellipse cx="32" cy="38" rx="15" ry="4.5" fill="#1e1b4b" opacity="0.6" />

  <!-- DATABASE TIER 2 (MIDDLE) -->
  <path d="M17 27 C17 23 47 23 47 27 L47 32 C47 36 17 36 17 32 Z" fill="url(#midPlate)" />
  <ellipse cx="32" cy="27" rx="15" ry="4.5" fill="#0f172a" opacity="0.5" />

  <!-- DATABASE TIER 1 (TOP) -->
  <path d="M17 16 C17 12 47 12 47 16 L47 21 C47 25 17 25 17 21 Z" fill="url(#topPlate)" />
  <!-- Top Surface Cap -->
  <ellipse cx="32" cy="16" rx="15" ry="4.8" fill="#e0f2fe" />
  <ellipse cx="32" cy="16" rx="13.5" ry="4" fill="url(#topPlate)" />

  <!-- Dynamic Shadow Cut / AI Energy Spark (S-Curved lightning core) -->
  <path d="M33 13 L27 26 L35 27 L30 40 L38 28 L30 27 Z" fill="#ffffff" filter="url(#shadowGlow)" opacity="0.95" />
  <circle cx="33" cy="14" r="1.5" fill="#ffffff" />
  <circle cx="30" cy="40" r="1.2" fill="#00f0ff" />
</svg>